# Секреты во всей истории git — gitleaks (make secrets). Свой тест
# в make check смотрит рабочее дерево; ключ, убранный следующим
# коммитом, остаётся в истории и в каждом клоне — его видит только
# разбор истории. Ложные срабатывания — в .gitleaksignore с причиной.
name: Секреты

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make secrets
