# Обязательная проверка: то же, что `make check` на своей машине.
#
# База поднимается тем же способом, что и локально, — целью `make db`
# в docker, а не службой Actions. Разойтись им нельзя: проверка цепочки
# миграций заводит себе отдельную базу ролью postgres, и роль
# приложения намеренно этого не умеет. Служба Actions такой пары ролей
# не даёт, и проверка молча стала бы проверять не то.
name: Проверка

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: проверка-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # История нужна предупреждению о коммитах без проверок:
          # оно смотрит каждый коммит пуша, а не только последний.
          fetch-depth: 0

      # Коммит, меняющий код без изменения проверок, — предупреждение,
      # а не отказ (PROMPT-TESTING.md, уровень 5): правке комментария
      # смотреть нечего, но пропуск должен быть виден.
      - name: Коммиты с кодом без проверок
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="origin/$BASE_REF..HEAD"
          elif [ -n "$BEFORE" ] && [ "${BEFORE#0000000}" = "$BEFORE" ]; then
            range="$BEFORE..$SHA"
          else
            exit 0
          fi
          ./scripts/tests-touched.sh "$range"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Зависимости клиента
        run: cd web && npm ci

      - name: Helm — для проверки чарта
        uses: azure/setup-helm@v4

      # HTML в docs/html руками не правится и обязан совпадать
      # с исходниками — за этим следит сам make check
      # (internal/docs, TestBuiltPagesMatchTheirSources). Отдельным
      # шагом «пересобрать и сравнить файлы» это делать нельзя:
      # в подвале страницы стоит версия сборки, она меняется с каждым
      # коммитом, и такой шаг краснел бы всегда.
      - run: make check
