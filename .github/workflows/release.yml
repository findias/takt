# Выпуск: собирается по тегу и ровно из того, что в теге.
#
# Версия приезжает в сборку линковщиком, а не читается из файла: файл
# в образе можно подменить, а версия обязана быть тем же артефактом,
# что и код. Отсюда --build-arg VERSION и -ldflags с тем же значением.
#
# Порядок намеренный: сперва проверка, потом артефакты. Тег, у которого
# не сошлась проверка, не должен превратиться в выпуск — его увидят
# раньше, чем мы успеем его снять.
#
# Имена работ и входов — латиницей. Не из вкуса: GitHub принимает в них
# только латиницу, цифру, дефис и подчёркивание, а на кириллице объявляет
# негодным весь файл и не запускает ничего — молча, одной строкой
# «workflow file issue» и без единого шага. Названия, которые видит
# человек, остаются русскими: они в `name`, и там кириллица законна.
name: Выпуск

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Тег, из которого собирать
        required: true

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - uses: azure/setup-helm@v4
      - run: make check

  # Образы собираются отдельной работой, а не вместе с архивами: у них
  # своя матрица оснований и свои реестры, и падение одного основания
  # не должно уносить выпуск целиком.
  #
  # В матрице только то, что публикуется. Основание, нужное одному
  # заказчику, собирается тем же Dockerfile у него самого:
  # `make image BASE=своё RUNTIME_BASE=...` — заводить его именем
  # в общей сборке незачем.
  images:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: alpine
            from: alpine:3.21
            platforms: linux/amd64,linux/arm64
          - base: debian
            from: debian:12-slim
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Кросс-архитектурная сборка: клиент и бинарник собираются
      # на amd64 и кладутся под целевую архитектуру, но базовый слой
      # arm64 тянется как есть — для него нужен qemu.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Вход в ghcr
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      # Docker Hub — только если задан. Форк и частная сборка не обязаны
      # иметь этих секретов, и ронять из-за них выпуск незачем.
      #
      # Проверка стоит внутри команды, а не в `if`, и это не вкусовщина:
      # контекст `secrets` в условиях недоступен вовсе — ни у шага,
      # ни у работы, — и `if: ${{ secrets.X != '' }}` делает негодным
      # весь файл. Ошибка при этом та же, что от кириллицы
      # в идентификаторе: «workflow file issue» и ни одного шага.
      - name: Вход в Docker Hub
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${HUB_TOKEN:-}" ]; then
            echo "::warning::секрет DOCKERHUB_TOKEN не задан — вход в Docker Hub пропущен"
            exit 0
          fi
          echo "$HUB_TOKEN" | docker login -u "$HUB_USER" --password-stdin

      # Имена переменных и функций — латиницей, как и идентификаторы
      # работ. Оболочка кириллицу в именах не принимает вовсе:
      # `набор=""` это для неё команда, которой нет.
      # Метка образа — латиницей: docker принимает в ней только
      # латиницу, цифру, точку, дефис и подчёркивание, а на кириллице
      # отвечает «invalid reference format» и не собирает ничего.
      - name: Метки
        env:
          BASE: ${{ matrix.base }}
          HUB: ${{ vars.DOCKERHUB_REPO }}
          GHCR: ghcr.io/${{ github.repository }}
        run: |
          set -eu
          tags=""
          add() { tags="$tags -t $1"; }

          add "${GHCR}:${GITHUB_REF_NAME}-${BASE}"
          # Основание по умолчанию получает и метку без суффикса,
          # и latest: `docker pull takt` обязан что-то значить.
          if [ "$BASE" = alpine ]; then
            add "${GHCR}:${GITHUB_REF_NAME}"
            add "${GHCR}:latest"
          fi

          if [ -n "$HUB" ]; then
            add "docker.io/${HUB}:${GITHUB_REF_NAME}-${BASE}"
            if [ "$BASE" = alpine ]; then
              add "docker.io/${HUB}:${GITHUB_REF_NAME}"
              add "docker.io/${HUB}:latest"
            fi
          else
            echo "::warning::переменная DOCKERHUB_REPO не задана — в Docker Hub ничего не поедет"
          fi

          echo "$tags" > /tmp/tags


      # Сборка до публикации, по одной архитектуре за раз и никуда
      # не уезжая: buildx отдаёт образ демону только по одной платформе
      # (`--load`), набор из нескольких умеет отдать лишь в реестр.
      # Публикация ниже соберёт набор заново — из этого же кеша.
      #
      # Образ своей архитектуры получает вдобавок метку без суффикса:
      # её ждёт разбор ниже, и написана она один раз здесь, а не двумя
      # именами архитектур в разных шагах.
      - name: Сборка под каждую архитектуру
        env:
          PLATFORMS: ${{ matrix.platforms }}
          FROM: ${{ matrix.from }}
          BASE: ${{ matrix.base }}
        run: |
          set -eu
          case "$(uname -m)" in
            x86_64) own=amd64 ;;
            aarch64) own=arm64 ;;
            *) own="$(uname -m)" ;;
          esac
          for platform in $(echo "$PLATFORMS" | tr ',' ' '); do
            arch="${platform#*/}"
            here=""
            if [ "$arch" = "$own" ]; then here="-t takt:scan-${BASE}"; fi
            # shellcheck disable=SC2086 -- метка своей архитектуры добавляется словом
            docker buildx build --load \
              --platform "$platform" \
              --build-arg VERSION="${GITHUB_REF_NAME}" \
              --build-arg RUNTIME_BASE="$FROM" \
              -t "takt:scan-${BASE}-${arch}" $here \
              .
          done

      # Собранное обязано запускаться, а не только собираться. Про arm64
      # до этого шага было известно ровно одно: линковщик отработал —
      # раннеры amd64, и ни одна проверка чужой архитектуры не касалась.
      # Запуск идёт под qemu, поднятым выше.
      #
      # Спрашивается версия, а не что попало: `takt version` отвечает
      # и при недоступной базе, а отвечает он тем, что вшито
      # линковщиком. Значит, одним шагом проверяется и то, что образ
      # вообще стартует на этой архитектуре, и то, что версия в нём
      # своя, — а она однажды уже переставала вшиваться молча.
      - name: Запуск собранного
        env:
          PLATFORMS: ${{ matrix.platforms }}
          BASE: ${{ matrix.base }}
        run: |
          set -eu
          for platform in $(echo "$PLATFORMS" | tr ',' ' '); do
            arch="${platform#*/}"
            said=$(docker run --rm --platform "$platform" \
              "takt:scan-${BASE}-${arch}" version)
            echo "${BASE}/${arch}: $said"
            if [ "$said" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::${BASE}/${arch}: образ отвечает «${said}», а собран из ${GITHUB_REF_NAME}"
              exit 1
            fi
          done

      # Разбор до публикации, а не после: образ с известной дырой,
      # уехавший в общий реестр, оттуда уже не вернуть — его успеют
      # скачать. Разбирается образ своей архитектуры: смотрит разбор
      # на пакеты основания, а они у одного и того же тега основания
      # на обеих архитектурах одни и те же.

      - name: Разбор образа
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: takt:scan-${{ matrix.base }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Почему нечинимое не считается — в security.yml, там же замер.
          ignore-unfixed: true

      - name: Публикация
        run: |
          set -eu
          # shellcheck disable=SC2086 -- набор меток разворачивается словами намеренно
          docker buildx build --push \
            --platform "${{ matrix.platforms }}" \
            --build-arg VERSION="${GITHUB_REF_NAME}" \
            --build-arg RUNTIME_BASE="${{ matrix.from }}" \
            $(cat /tmp/tags) \
            .

  artifacts:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история — иначе git describe не найдёт тег,
          # и в бинарник уедет хеш вместо версии.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: azure/setup-helm@v4

      - run: cd web && npm ci

      # Архитектура задаётся одним GOARCH: имя архива выводится из него
      # же. Прежде их было два, и архив с чужим именем никто бы
      # не заметил до распаковки у заказчика.
      #
      # Список архитектур здесь сверяется с платформами образов
      # (`internal/ci`): архивы и образы обязаны предлагать одно и то же,
      # иначе поставка «под arm64» означает разное в двух соседних
      # строках выпуска.
      - name: Архивы для установки из бинарника
        run: |
          GOARCH=amd64 make tarball
          GOARCH=arm64 make tarball

      # Обе версии — из тега: у чарта своя нумерация не заведена,
      # выпускается он вместе с образом и архивом. Пока проставлялась
      # одна appVersion, `version` стояла в Chart.yaml и отставала —
      # v0.2.1 положил в релиз `takt-0.2.0.tgz`.
      #
      # `#v` снимает букву: helm требует semver, а теги у нас с «v».
      - name: Чарт
        run: |
          mkdir -p dist
          helm package deploy/helm/takt \
            --version "${GITHUB_REF_NAME#v}" \
            --app-version "${GITHUB_REF_NAME}" -d dist

      # Состав поставки в CycloneDX. Проверка ИБ у заказчика начинается
      # с вопроса «из чего это собрано», и ответом должен быть файл,
      # который загружают в свою систему, а не письмо через месяц.
      - name: Состав поставки
        run: make sbom

      # Отчёты сканеров машинным форматом. Выпуск из-за находок
      # не останавливается — это дело отдельного прогона
      # «Безопасность», — но приложить отчёт надо и тогда, когда
      # находки есть: выпуск без отчёта выглядит как выпуск,
      # которому нечего показать.
      - name: Отчёты сканеров
        continue-on-error: true
        run: make security-report

      - name: Суммы
        # В закрытый контур файл едет через посредников, и «тот ли это
        # файл» — вопрос, который зададут. Состав и отчёты суммируются
        # наравне с образом: подменённый SBOM отвечает на вопрос ИБ
        # чужим ответом.
        run: |
          # По каждому файлу, а не по перечню шаблонов: отчёты сканеров
          # собираются шагом, которому позволено не пройти, и шаблон
          # `security/*`, не совпавший ни с чем, уехал бы в команду
          # как есть — и обвалил бы выпуск на подсчёте сумм.
          cd dist
          find . -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs -r sha256sum > SHA256SUMS

      - name: Что менялось в этой версии
        # Список изменений — из CHANGELOG.md, а не из заголовков
        # коммитов: он написан для того, кто ставит и обновляет,
        # и написан заранее. Берётся ровно раздел этого тега: целый
        # файл в описании выпуска читать никто не станет.
        run: |
          # Имена переменных awk — латиницей: кириллические он не берёт
          # вовсе, `awk: fatal: `тег' is not a legal variable name`.
          # Прежний вариант убил бы каждый выпуск, но файл рабочего
          # процесса был негоден целиком и до awk дело не доходило.
          awk -v tag="${GITHUB_REF_NAME}" '
            $0 ~ "^## " tag "( |$)" { take = 1; next }
            take && /^## v/ { exit }
            take { print }
          ' CHANGELOG.md > dist/ОПИСАНИЕ.md
          if [ ! -s dist/ОПИСАНИЕ.md ]; then
            echo "::error::в CHANGELOG.md нет раздела ${GITHUB_REF_NAME} — выпуск без списка изменений не делаем"
            exit 1
          fi

      - name: Выпуск
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: dist/ОПИСАНИЕ.md
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tgz
            dist/SHA256SUMS
            dist/sbom/*.json
            dist/security/*
