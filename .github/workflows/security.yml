# Проверки, которым нужна сеть, и поэтому их нет в `make check`:
# он обязан проходить и в закрытом контуре.
#
# По расписанию, а не только на правках: дыру в зависимости находят
# не тогда, когда мы её трогаем, а тогда, когда её опубликуют.
#
# На каждом предложении правок целиком, без отбора по путям. Отбор тут
# был и выглядел разумно — `**.go`, `go.sum`, `package-lock.json`, — но
# делал ровно две вещи, обе плохие. Правка, до этих путей не достающая,
# проезжала вообще без разбора: `web/package.json` в списке не значился,
# и смена зависимости клиента мимо lock-файла проверку не будила.
# И, что хуже, проверка, которую отбор промолчал, не появляется в списке
# вовсе — сделать её обязательной нельзя: она вечно «ожидается».
# Три минуты на предложение дешевле обоих случаев.
name: Безопасность

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Зависимости клиента
        run: cd web && npm ci

      - run: make security

  # Образ разбирается отдельно от исходников, и это не дублирование.
  # govulncheck и npm audit смотрят на то, что мы написали; в образ
  # едет ещё и основание — alpine со своим openssl, busybox и musl.
  # Дыра там наша ровно в той же мере: ставит её заказчик, а чинить
  # придётся нам, подняв версию основания.
  #
  # Здесь образ только собирается и разбирается, никуда не уезжая:
  # публикация — в выпуске, и там тот же разбор стоит перед пушем.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Ни Go, ни Node ставить не нужно: и клиент, и бинарник
      # собираются слоями внутри docker.
      - name: Образ
        run: make image

      - name: Разбор образа
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: takt:dev
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Уязвимости без выпущенной починки не считаются, и это
          # не поблажка, а замер: у debian:12-slim их 30 при нуле
          # чинимых (26 HIGH, 4 CRITICAL, 26.08.2026). Прогон, который
          # красен всегда и погасить его нечем, через неделю перестают
          # читать — и вместе с ним перестают читать настоящие находки.
          # Появится починка — та же проверка её и покажет.
          ignore-unfixed: true
