<!doctype html><html><head><meta charset="utf-8"><style>body{padding:16px;margin:0}.demo{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end}.word{display:flex;align-items:center;gap:12px;font-weight:650;font-size:18px}</style></head><body>
<div id="root"></div>
<script>
(() => {
const T = window.Takt, h = React.createElement
function Demo() {
  return h('div', { className: 'demo' },
    h(T.Mark, { size: 96 }),
    h(T.Mark, { size: 56 }),
    h(T.Mark, { size: 24 }),
    h(T.Mark, { size: 16 }),
    h(T.Mark, { size: 40, swing: true }),
    h('span', { className: 'word' }, h(T.Mark, { size: 24 }), 'Takt'))
}
T.ready.then(() => ReactDOM.createRoot(document.getElementById('root')).render(h(Demo)))
})()
</script>
</body></html>
