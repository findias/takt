<!-- @dsCard group="Люди" height=90 subtitle="тон по имени; 20 и 32 px; «+N»" -->
<!doctype html><html><head><meta charset="utf-8"><style>body{padding:16px;margin:0}.demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.demo+.demo{margin-top:12px}</style></head><body>
<div id="root"></div>
<script>
(() => {
const T = window.Takt, h = React.createElement, { useState } = React
const people = ['Анна Орлова', 'Борис Ким', 'Вера Лебедева', 'Глеб Носов', 'Дина Юсупова', 'Егор Павлов', 'Жанна Ли', 'Зоя Громова']
function Demo() {
  return h('div', null,
    h('div', { className: 'demo' }, people.map((n) => h(T.Avatar, { key: n, name: n }))),
    h('div', { className: 'demo' }, h('span', { className: 'avatars' },
      people.slice(0, 3).map((n) => h(T.Avatar, { key: n, name: n, size: 32 })),
      h(T.AvatarMore, { count: 5, size: 32 }))))
}
T.ready.then(() => ReactDOM.createRoot(document.getElementById('root')).render(h(Demo)))
})()
</script>
</body></html>
