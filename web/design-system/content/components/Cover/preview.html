<!-- @dsCard height=288 -->
<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:var(--paper)}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--paper)}
svg{position:absolute;inset:0}
.accent{fill:var(--accent)} .ink{fill:var(--ink)} .strong{fill:var(--rule-strong)}
.card{fill:var(--surface);rx:var(--radius)} .slab{rx:var(--radius-lg)}
.caution{fill:var(--caution)} .pill{rx:6px}
.text{position:absolute;left:40px;bottom:24px;max-width:440px}
.name{margin:0;font-family:var(--font-ui);font-size:120px;line-height:.9;font-weight:650;color:var(--ink);letter-spacing:-0.02em}
.tag{margin:8px 0 0;font-family:var(--font-ui);font-size:14px;line-height:20px;color:var(--ink-3)}
</style></head><body><div class="cover">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!-- blocks: accent 128×264, ink 128×224, rule-strong 168×288 (bleeds top and right); surface cards inside
         arrangement: three board columns staggered from x=480, the right one bleeding off the edge
         pattern: "geometric, modular, dense UI" — tiles cut by radius, because a board is literally columns of cards
         scales: gaps space-2 (8), inset space-3 (12), card radius (4), column radius-lg (8), one caution pill -->
    <rect class="accent slab" x="504" y="24" width="128" height="272"/>
    <rect class="card" x="516" y="36" width="104" height="40"/>
    <rect class="card" x="516" y="84" width="104" height="56"/>
    <rect class="card" x="516" y="148" width="104" height="40"/>
    <rect class="card" x="516" y="196" width="104" height="48"/>
    <rect class="ink slab" x="648" y="64" width="128" height="232"/>
    <rect class="card" x="660" y="76" width="104" height="56"/>
    <rect class="card" x="660" y="140" width="104" height="40"/>
    <rect class="caution pill" x="668" y="160" width="40" height="12"/>
    <rect class="card" x="660" y="188" width="104" height="40"/>
    <rect class="strong slab" x="792" y="0" width="168" height="296"/>
    <rect class="card" x="804" y="12" width="144" height="40"/>
    <rect class="card" x="804" y="60" width="144" height="40"/>
    <rect class="card" x="804" y="108" width="144" height="64"/>
    <rect class="card" x="804" y="180" width="144" height="48"/>
    <rect class="card" x="804" y="236" width="144" height="40"/>
  </svg>
  <div class="text"><p class="name">Takt</p><p class="tag">Канбан-доска с метриками потока для одной команды.</p></div>
</div></body></html>
