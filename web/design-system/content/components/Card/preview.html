<!-- @dsCard group="Доска" height=560 subtitle="обычная, заблокированная, с превышением срока — в колонке" -->
<!doctype html><html><head><meta charset="utf-8"><style>body{padding:16px;margin:0}.demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.demo+.demo{margin-top:12px}</style><style>.column{max-width:300px}</style></head><body>
<div class="column">
  <ol class="cards">
    <li class="card" tabindex="0" role="group" aria-label="Карточка: Перенести оплату на новый шлюз">
      <div class="card-meta"><span class="card-number">ПОСТ-128</span><button type="button" class="chip chip--violet card-epic" title="Новый платёжный контур">Новый платёжный контур</button></div>
      <div class="card-head"><button class="card-title">Перенести оплату на новый шлюз</button><span class="field"><span class="avatars"><span class="avatar avatar--tone-0" style="inline-size:20px;block-size:20px;font-size:11px" title="Анна">А</span><span class="avatar avatar--tone-2" style="inline-size:20px;block-size:20px;font-size:11px" title="Вера">В</span></span></span></div>
      <div class="card-labels"><span class="chip chip--green chip--card">бэкенд</span><span class="chip chip--amber chip--card">ИБ</span></div>
      <div class="card-marks"><span class="mark mark--quiet">Итерация 14</span><span class="card-estimate">5</span></div>
    </li>
    <li class="card" tabindex="0" role="group" aria-label="Карточка: Выгрузка отчёта в XLSX">
      <div class="card-meta"><span class="card-number">ПОСТ-131</span><span class="card-parent"><span aria-hidden="true">↳ </span><button class="link">Отчёт по итерации</button></span></div>
      <div class="card-head"><button class="card-title">Выгрузка отчёта в XLSX</button><span class="field"><span class="avatars"><span class="avatar avatar--tone-1" style="inline-size:20px;block-size:20px;font-size:11px" title="Борис">Б</span></span></span></div>
      <div class="card-marks"><span class="mark mark--alarm">Заблокирована: ждём доступ к хранилищу</span><span class="card-block-until">снимется через 2 дн.</span></div>
    </li>
    <li class="card" tabindex="0" role="group" aria-label="Карточка: Поиск по архиву">
      <div class="card-meta"><span class="card-number">ПОСТ-117</span></div>
      <div class="card-head"><button class="card-title">Поиск по архиву</button></div>
      <div class="card-labels"><span class="chip chip--blue chip--card">клиент</span></div>
      <div class="card-marks"><span class="mark mark--alarm mark--aging">Идёт 12 дн. — дольше обещанных 8</span><span class="priority-mark priority-mark--high">важно</span><span class="card-estimate">3</span></div>
    </li>
  </ol>
</div>
</body></html>
