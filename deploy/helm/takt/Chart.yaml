apiVersion: v2
name: takt
description: "Канбан-доска: один образ, внешняя база PostgreSQL"

# Зависимостей нет намеренно. Подключить сюда чарт с базой было бы
# заманчиво — установка в одну команду, — но это ровно то, что нельзя
# ставить в закрытом контуре и нельзя эксплуатировать всерьёз: база
# у заказчика своя, с резервным копированием и восстановлением
# на момент времени, и подсовывать ей замену внутри нашего чарта значит
# отвечать за чужую зону ответственности.
type: application

# Обе версии проставляются при упаковке — выпуском по тегу и `make
# bundle`, — а здесь стоит заглушка. Числа тут стояли настоящие и
# отставали: выпуск правил только appVersion, `version` осталась
# на 0.2.0, и релиз v0.2.1 положил `takt-0.2.0.tgz` — второй файл
# с тем же именем и той же версией чарта, что и у прошлого выпуска.
# Для `helm repo` это столкновение, для установки из файла — вопрос
# «а этот чарт от какой версии».
#
# Разводить номера чарта и приложения — обычная и здравая помощь
# (правку шаблона можно выкатить, не притворяясь, что сменилось
# приложение), но у нас чарт не выпускается отдельно: тег один
# на образ, архив и чарт. Значит, и номер один, а порознь они
# означали лишь то, что один из двух молча стоит.
#
# 0.0.0 — признак сборки мимо выпуска, как «версия не задана»
# у бинарника. Чарт, поставленный из репозитория как есть, попросит
# `ghcr.io/findias/takt:0.0.0` и не найдёт его — это лучше, чем молча
# поставить прошлую версию.
version: 0.0.0
appVersion: "0.0.0"

kubeVersion: ">=1.25.0-0"
