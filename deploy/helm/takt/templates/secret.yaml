{{- if or .Values.postgresql.enabled (not .Values.database.existingSecret) }}
{{- if and (not .Values.postgresql.enabled) (not .Values.database.url) }}
{{- fail "нужен database.url или database.existingSecret: приложению нечем подключиться к базе" }}
{{- end }}
{{- if and .Values.postgresql.enabled .Values.database.url }}
{{- fail "заданы и postgresql.enabled, и database.url: чарт не может решить за вас, куда ходить приложению — оставьте что-то одно" }}
{{- end }}
# Секрет, созданный чартом, — способ для стенда. На бою пароль базы
# не должен лежать в values: оттуда он попадает и в историю выкладок,
# и в вывод `helm get values`, который читают шире, чем кажется.
# Для боя: kubectl create secret generic takt-db --from-literal=DATABASE_URL=...
#
# При базе в кластере строка собирается чартом: адрес службы и имя роли
# заданы там же, и просить написать их ещё раз руками значит завести
# второе место, которому предстоит разойтись с первым.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "takt.secretName" . }}
  labels:
    {{- include "takt.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ if .Values.postgresql.enabled }}{{ include "takt.embeddedDatabaseURL" . | quote }}{{ else }}{{ .Values.database.url | quote }}{{ end }}
{{- end }}
