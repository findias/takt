{{- if .Values.migrations.enabled }}
# Миграции — задача перед выкладкой, а не действие при старте приложения.
#
# Стартовать миграцию в каждом поде проще всего и работает ровно до второй
# реплики: две одновременно стартующие реплики мигрируют базу параллельно,
# и чем это кончится, зависит от везения. Хук pre-install/pre-upgrade
# выполняет её один раз и до того, как поедут новые поды.
#
# hook-delete-policy: упавшая задача остаётся — по ней и смотрят, почему
# не поехала выкладка. Удаляется она перед созданием следующей, а не после
# провала.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "takt.fullname" . }}-migrate
  labels:
    {{- include "takt.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.postgresql.enabled }}
    # База поднимается этим же чартом, а хуки выполняются до основных
    # ресурсов — то есть до того, как база вообще появится. Поэтому
    # в стендовом режиме миграция идёт обычным ресурсом, следом
    # за StatefulSet, и ждёт готовности базы своим initContainer'ом.
    # Приложение в эти несколько секунд перезапускается: оно отказывается
    # стартовать на непроинициализированной базе, и это лучше, чем
    # отвечать ошибкой на каждый запрос.
    helm.sh/hook-weight: "5"
    {{- else }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- end }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.timeoutSeconds }}
  template:
    metadata:
      labels:
        {{- include "takt.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "takt.serviceAccountName" . }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        # Ждём, пока база примет подключения. Без этого задача падает
        # на первой же секунде первой установки — и падает по причине,
        # которая через двадцать секунд перестанет существовать.
        - name: wait-for-db
          image: {{ .Values.postgresql.image }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "takt.postgresName" . }} -U {{ .Values.postgresql.username }} -d {{ .Values.postgresql.database }}; do
                echo "жду базу"
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        seccompProfile:
          {{- toYaml .Values.securityContext.seccompProfile | nindent 10 }}
      containers:
        - name: migrate
          image: {{ include "takt.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            {{- include "takt.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            capabilities:
              {{- toYaml .Values.securityContext.capabilities | nindent 14 }}
{{- end }}
