# Значения по умолчанию.
#
# Правило, которому подчинён весь чарт: установка не должна требовать
# доступа в интернет. Ни одна ссылка отсюда никуда не ведёт, образ берётся
# из указанного реестра, зависимостей у чарта нет.

image:
  repository: ghcr.io/konkov/board
  # Тег или digest. В закрытом контуре образ приезжает в зеркало, и
  # ссылка на него по digest — единственный способ убедиться, что это
  # тот же образ, который проверяли: тег в зеркале можно переписать.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Реплик по умолчанию две. Одна означает простой при каждой выкладке
# и при каждом переезде узла; приложение к нескольким готово — сессии
# лежат в базе, а изменения расходятся через LISTEN/NOTIFY, поэтому
# ни липких сессий, ни общего диска не нужно.
replicaCount: 2

# Адрес, по которому доску открывают. Из него собираются ссылки
# в приглашениях и признак защищённой cookie, поэтому ошибка здесь
# выглядит не как ошибка, а как «приглашения не работают».
baseURL: ""

# Кто заводит организации.
#
#   first  — пока в установке нет ни одной организации, её заводит тот,
#            кто пришёл первым; дальше только по приглашению. Умолчание,
#            и оно же ответ на вопрос «кто заводит первого владельца»:
#            он заводит себя сам, ровно один раз, до того как установку
#            кому-то показали.
#   open   — кто угодно. Так работает наш стенд и так работала бы
#            облачная установка с сотней арендаторов.
#   closed — никто, включая первого. Для установки, где организация
#            заводится заранее, а вход идёт только через провайдера.
#
# Открытая регистрация на стенде — удобство; на установке, выставленной
# в корпоративную сеть, — это возможность завести организацию мимо
# каталога, мимо провайдера входа и мимо владельца.
signup: first

database:
  # Строка подключения целиком. Кладётся в секрет; в values её оставлять
  # не нужно и не стоит — см. existingSecret.
  url: ""
  # Секрет, созданный до установки. Предпочтительный способ: пароль базы
  # не должен попадать ни в values.yaml, ни в историю выкладок, ни
  # в вывод `helm get values`.
  existingSecret: ""
  existingSecretKey: DATABASE_URL

# База в кластере — способ для стенда, а не основной.
#
# Основное расположение базы — железо (или отдельный оператор вроде
# CloudNativePG, пример лежит в `deploy/postgres/`). Причина не в моде
# на «stateless в кластере», а в том, что за базу отвечает тот, у кого
# она стоит: резервные копии, восстановление на момент времени, разбор
# места и планов запросов — всё это чужая зона, и подменять её нашим
# манифестом значит обещать то, чего чарт не делает.
#
# Поэтому здесь выключено по умолчанию. Включают его там, где нужен
# работающий стенд одной командой и где данными можно пожертвовать:
# одна реплика, один диск, ни архивирования, ни отработки отказа.
postgresql:
  enabled: false
  image: postgres:17-alpine
  # Имя базы и роли приложения. Роль заводится БЕЗ прав суперпользователя
  # намеренно: для суперпользователя политики Row-Level Security
  # не действуют вовсе, и изоляция организаций молча превращается
  # в ничто — запросы работают, просто отдают лишнее. Приложение
  # проверяет это при старте и отказывается запускаться.
  database: board
  username: board
  # Пароли задаются явно и не генерируются чартом: сгенерированный
  # при установке пароль меняется при каждом `helm upgrade`, и база
  # с прежним паролем перестаёт пускать ровно в момент выкладки.
  password: ""
  superuserPassword: ""
  # Секрет, созданный до установки, — тот же довод, что и у внешней базы.
  # Ключи: POSTGRES_PASSWORD (суперпользователь) и APP_DB_PASSWORD (роль
  # приложения).
  existingSecret: ""
  storage: 20Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Миграции — отдельная задача перед выкладкой, а не действие при старте
# приложения. Две реплики, стартующие одновременно, мигрировали бы базу
# параллельно; чем это заканчивается, зависит от везения.
migrations:
  enabled: true
  # Сколько ждать задачу до отказа от выкладки. Долгая миграция на большой
  # базе — норма, поэтому запас щедрый.
  timeoutSeconds: 900
  backoffLimit: 1

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls:
    enabled: false
    secretName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    # Предела по процессору нет намеренно: он не защищает соседей (это
    # делает запрос), а только добавляет задержек рывками. Предел
    # по памяти есть — утечка должна убивать реплику, а не узел.
    memory: 512Mi

# Столько живёт под после сигнала остановки. Внутри процесс сперва снимает
# с себя готовность и ждёт, пока его вычеркнут из балансировки (5 с),
# потом закрывает соединения (до 30 с). Значение обязано быть больше суммы,
# иначе под убьют посреди корректной остановки.
terminationGracePeriodSeconds: 45

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Разносить реплики по узлам, но не любой ценой: в кластере из одного узла
# требование «строго по разным» превратило бы вторую реплику в вечно
# ожидающую.
spreadAcrossNodes: true

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Приложение ничего не пишет на диск: состояние в базе, статика внутри
# образа. Значит, корень можно сделать доступным только для чтения —
# и тогда взлом процесса не оставляет места, куда положить принесённое.
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

extraEnv: []
