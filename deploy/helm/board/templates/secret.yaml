{{- if not .Values.database.existingSecret }}
{{- if not .Values.database.url }}
{{- fail "нужен database.url или database.existingSecret: приложению нечем подключиться к базе" }}
{{- end }}
# Секрет, созданный чартом, — способ для стенда. На бою пароль базы
# не должен лежать в values: оттуда он попадает и в историю выкладок,
# и в вывод `helm get values`, который читают шире, чем кажется.
# Для боя: kubectl create secret generic board-db --from-literal=DATABASE_URL=...
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "board.secretName" . }}
  labels:
    {{- include "board.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
