{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "board.serviceAccountName" . }}
  labels:
    {{- include "board.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Приложение не ходит в API кластера: ему нечего там спрашивать.
# Токен не монтируется — то, чего нет в поде, нельзя украсть из пода.
automountServiceAccountToken: false
{{- end }}
